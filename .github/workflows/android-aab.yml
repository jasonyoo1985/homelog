name: Android AAB (internal test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept Android SDK licenses (SDK is preinstalled on runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Read app build number
        run: echo "APP_BUILD=$(node -p \"require('./app-version.json').build\")" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_VERSION: 0.1.${{ env.APP_BUILD }}
      - run: npx cap sync android

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::UPLOAD_KEYSTORE_BASE64 시크릿이 없어 서명되지 않은 AAB가 생성됩니다."
          fi

      - name: Build release AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ env.APP_BUILD }}
          VERSION_NAME: 0.1.${{ env.APP_BUILD }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: homelog-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
